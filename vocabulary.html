<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Teacher Angela's Kiosk</title>
    <link href="https://fonts.cdnfonts.com/css/speedee" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        :root {
            --mcd-red: #DA291C;
            --mcd-yellow: #FFC72C;
            --mcd-black: #27251F;
        }

        body { 
            font-family: 'Speedee', 'Segoe UI', Roboto, Helvetica, Arial, sans-serif, 'Apple Color Emoji', 'Segoe UI Emoji', 'Segoe UI Symbol'; 
            background-color: #f7f7f7;
            color: var(--mcd-black);
            touch-action: manipulation; /* Prevents accidental zooming while playing */
        }

        .brand-red { background-color: var(--mcd-red); }
        .brand-yellow { background-color: var(--mcd-yellow); }
        
        .emoji-text {
            font-family: 'Apple Color Emoji', 'Segoe UI Emoji', 'Segoe UI Symbol', sans-serif;
            line-height: 1.2;
        }

        .receipt-paper {
            background-color: white;
            color: #111;
            padding: 2rem;
            width: 100%;
            max-width: 320px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            position: relative;
            border: 1px solid #eee;
        }
        .receipt-paper::after {
            content: "";
            position: absolute;
            bottom: -10px; left: 0; right: 0;
            height: 10px;
            background: linear-gradient(-45deg, transparent 5px, white 5px), linear-gradient(45deg, transparent 5px, white 5px);
            background-size: 10px 10px;
        }

        .item-card { background: white; border-radius: 12px; border: 2px solid #eee; transition: all 0.2s ease; -webkit-tap-highlight-color: transparent; }
        .item-card:hover:not(.item-disabled) { border-color: var(--mcd-yellow); transform: translateY(-2px); }
        .item-disabled { opacity: 0.25; filter: grayscale(1); cursor: not-allowed; }

        .category-header { 
            grid-column: 1 / -1; font-weight: 800; text-transform: uppercase; 
            font-size: 1.25rem; margin: 20px 0 10px 0; color: var(--mcd-red);
            border-bottom: 2px solid var(--mcd-yellow); display: inline-block;
        }

        /* Touch-Friendly Word Pills */
        .word-pill { 
            background: white; 
            border: 2px solid #ddd; 
            padding: 12px 24px; 
            border-radius: 50px; 
            font-weight: 700; 
            cursor: pointer; 
            touch-action: none; /* Required for custom drag logic */
            user-select: none;
            display: inline-block;
        }
        
        .word-pill.active-tap {
            border-color: var(--mcd-red);
            background-color: #fff5f5;
            box-shadow: 0 0 15px rgba(218, 41, 28, 0.3);
        }

        .drop-zone { 
            min-width: 100px; 
            border-bottom: 4px solid var(--mcd-red); 
            display: inline-block; 
            text-align: center; 
            color: var(--mcd-red); 
            font-weight: 800; 
            padding: 0 10px;
            transition: background 0.2s;
        }
        
        .drop-zone.target-highlight {
            background-color: rgba(255, 199, 44, 0.2);
        }

        .correct-glow { background-color: #f0fff4; border: 3px solid #48bb78 !important; }

        .wheel-box { position: relative; width: 300px; height: 300px; margin: 0 auto; }
        .wheel-visual {
            width: 100%; height: 100%; border-radius: 50%; border: 10px solid var(--mcd-black);
            background: conic-gradient(#DA291C 0deg 60deg, #FFC72C 60deg 120deg, #27251F 120deg 180deg, #DA291C 180deg 240deg, #FFC72C 240deg 300deg, #27251F 300deg 360deg);
            transition: transform 4s cubic-bezier(0.15, 0, 0.15, 1);
        }
        .wheel-label { position: absolute; width: 100%; height: 100%; display: flex; justify-content: center; align-items: flex-start; padding-top: 20px; font-weight: 900; font-size: 2.5rem; color: white; }
        .wheel-pointer { position: absolute; top: -10px; left: 50%; transform: translateX(-50%); width: 0; height: 0; border-left: 20px solid transparent; border-right: 20px solid transparent; border-top: 40px solid var(--mcd-black); z-index: 20; }
        
        .fs-btn { position: absolute; top: 10px; right: 10px; z-index: 100; cursor: pointer; padding: 8px; background: rgba(0,0,0,0.2); border-radius: 8px; color: white; }
        
        /* Drag Shadow */
        #dragGhost {
            position: fixed;
            pointer-events: none;
            padding: 10px 20px;
            background: white;
            border: 2px solid var(--mcd-red);
            border-radius: 50px;
            font-weight: 700;
            z-index: 1000;
            opacity: 0.8;
            display: none;
            transform: translate(-50%, -50%);
        }
    </style>
</head>
<body class="h-screen flex items-center justify-center p-4 overflow-hidden">

    <div id="dragGhost"></div>
    <div onclick="toggleFullscreen()" class="fs-btn">⛶</div>

    <div id="landingPage" class="text-center">
        <h1 class="text-6xl font-black italic text-red-600 mb-6">Welcome!</h1>
        <p class="text-2xl font-bold mb-10 text-gray-700">Ready to practice your grammar?</p>
        <button onclick="startOrdering()" class="brand-red text-white text-3xl font-black px-12 py-6 rounded-3xl hover:scale-105 transition-transform shadow-xl uppercase">
            Start Ordering
        </button>
    </div>

    <div id="kioskContainer" class="w-full max-w-6xl h-[90vh] flex flex-col bg-white shadow-2xl rounded-2xl overflow-hidden border border-gray-200 hidden">
        <header class="brand-red p-6 text-white flex justify-between items-center">
            <div>
                <h1 class="text-4xl font-black italic tracking-tighter">Teacher Angela's</h1>
                <p class="text-sm font-bold text-yellow-300 uppercase tracking-widest">Grammar Kiosk</p>
            </div>
            <div class="flex gap-4">
                <div class="bg-black/20 p-2 rounded-lg text-center border border-white/20">
                    <span class="text-[10px] font-bold block uppercase">Budget</span>
                    <input type="number" id="budgetInput" value="300" step="50" class="bg-transparent w-16 text-center font-black text-xl outline-none" oninput="updateKiosk()">
                </div>
                <div class="bg-white p-2 rounded-lg text-center min-w-[100px]">
                    <span class="text-[10px] font-bold block uppercase text-gray-500">Balance</span>
                    <div id="balanceDisplayTop" class="text-xl font-black text-red-600">$300</div>
                </div>
            </div>
        </header>

        <main class="flex flex-1 overflow-hidden">
            <section class="flex-[3] p-8 overflow-y-auto bg-gray-50">
                <div id="menuGrid" class="grid grid-cols-2 lg:grid-cols-4 gap-6 pb-10"></div>
            </section>
            
            <aside class="flex-1 bg-white border-l p-6 flex flex-col">
                <h3 class="text-2xl font-black uppercase mb-4">My Order</h3>
                <div id="cartList" class="flex-1 overflow-y-auto space-y-2"></div>
                <div class="mt-4 pt-4 border-t-4 border-double border-gray-200">
                    <div class="flex justify-between text-2xl font-black mb-4">
                        <span>Total</span>
                        <span id="totalDisplay" class="text-red-600">$0</span>
                    </div>
                    <div class="flex flex-col gap-2">
                        <button onclick="handleCheckout()" id="payBtn" class="w-full brand-red text-white py-4 rounded-xl font-black uppercase text-xl shadow-lg hover:brightness-105 active:scale-95 transition-all disabled:opacity-50">Check Out</button>
                        <button onclick="resetOrder()" class="w-full brand-yellow text-black py-2 rounded-xl font-black uppercase text-sm hover:brightness-105 transition-all">Reset Order</button>
                    </div>
                </div>
            </aside>
        </main>
    </div>

    <div id="gameModal" class="fixed inset-0 bg-gray-100 hidden z-40 overflow-hidden">
        <div onclick="toggleFullscreen()" class="fs-btn !bg-black/20">⛶</div>
        <div class="flex h-full">
            <div class="w-1/3 bg-gray-200 p-8 flex flex-col items-center border-r border-gray-300">
                <div class="receipt-paper">
                    <div class="text-center mb-6 border-b-2 border-dashed border-gray-300 pb-4">
                        <h2 class="text-xl font-black italic">Teacher Angela's Fastfood</h2>
                        <p class="text-xs text-gray-500 uppercase tracking-widest mt-1">Official Receipt</p>
                    </div>
                    <div id="receiptItems" class="space-y-2 mb-6 text-sm font-bold uppercase tracking-tight"></div>
                    <div class="border-t-2 border-dashed border-gray-300 pt-4">
                        <div class="flex justify-between font-black text-lg">
                            <span>CHANGE</span>
                            <span id="receiptChange">$0</span>
                        </div>
                    </div>
                </div>
                <button onclick="closeChallenge()" class="mt-8 text-gray-500 font-bold uppercase hover:text-red-600">← Edit Order</button>
            </div>

            <div class="w-2/3 p-12 overflow-y-auto flex flex-col items-center bg-white">
                <h2 class="text-5xl font-black italic text-red-600 mb-2">Wait!</h2>
                <p class="text-xl font-bold text-gray-500 mb-4 uppercase tracking-widest text-center">Drag or Tap the words to the blanks</p>
                <div id="wordBank" class="flex flex-wrap justify-center gap-4 mb-10 bg-gray-100 p-6 rounded-3xl w-full max-w-2xl"></div>
                <div id="challengeList" class="space-y-6 w-full max-w-2xl mb-12"></div>
                <div class="flex gap-4">
                    <button onclick="checkAnswers()" id="checkBtn" class="brand-yellow px-16 py-5 rounded-2xl font-black text-2xl uppercase shadow-xl">Check Answers</button>
                    <button onclick="openWheelModal()" id="finishBtn" class="hidden bg-green-500 text-white px-16 py-5 rounded-2xl font-black text-2xl uppercase animate-bounce">Claim Your Stamps!</button>
                </div>
            </div>
        </div>
    </div>

    <div id="wheelModal" class="fixed inset-0 bg-black/95 hidden z-50 flex items-center justify-center">
        <div onclick="toggleFullscreen()" class="fs-btn">⛶</div>
        <div class="bg-white p-12 rounded-[40px] text-center max-w-md w-full mx-4">
            <h2 class="text-4xl font-black italic text-red-600 mb-8">STAMP LUCK</h2>
            <div class="wheel-box mb-8">
                <div class="wheel-pointer"></div>
                <div id="wheel" class="wheel-visual">
                    <div class="wheel-label" style="transform: rotate(30deg)">1</div>
                    <div class="wheel-label" style="transform: rotate(90deg)">2</div>
                    <div class="wheel-label" style="transform: rotate(150deg)">3</div>
                    <div class="wheel-label" style="transform: rotate(210deg)">1</div>
                    <div class="wheel-label" style="transform: rotate(270deg)">2</div>
                    <div class="wheel-label" style="transform: rotate(330deg)">3</div>
                </div>
            </div>
            <button onclick="spinWheel()" id="spinBtn" class="w-full brand-red text-white py-5 rounded-2xl font-black text-2xl uppercase shadow-xl">Spin!</button>
            <div id="wheelResult" class="hidden flex flex-col items-center">
                <div id="stampsWonMsg" class="text-7xl font-black text-red-600 mb-2"></div>
                <p id="congratsMsg" class="text-2xl font-bold uppercase mb-6"></p>
                <button onclick="location.reload()" class="bg-black text-white px-12 py-4 rounded-xl font-bold uppercase">Next Student</button>
            </div>
        </div>
    </div>

    <script>
        // Fullscreen Logic
        function toggleFullscreen() {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen();
            } else if (document.exitFullscreen) {
                document.exitFullscreen();
            }
        }

        // Kiosk Logic
        const numberToWord = ["zero", "one", "two", "three", "four", "five", "six", "seven", "eight", "nine", "ten"];
        const menuData = {
            "Mains": [
                { id: 'pizza', name: "pizza", price: 120, icon: "🍕", type: 1 },
                { id: 'burger', name: "burger", plural: "burgers", price: 79, icon: "🍔", type: 0 },
                { id: 'hotdog', name: "hotdog", plural: "hotdogs", price: 50, icon: "🌭", type: 0 },
                { id: 'sandwich', name: "sandwich", plural: "sandwiches", price: 65, icon: "🥪", type: 0 },
                { id: 'taco', name: "taco", plural: "tacos", price: 85, icon: "🌮", type: 0 },
                { id: 'friedchicken', name: "fried chicken", price: 110, icon: "🍗", type: 1 },
                { id: 'spaghetti', name: "spaghetti", price: 95, icon: "🍝", type: 1 },
                { id: 'noodles', name: "noodles", price: 80, icon: "🍜", type: 1 }
            ],
            "Sides": [
                { id: 'pancake', name: "pancakes", price: 60, icon: "🥞", type: 1 },
                { id: 'cake', name: "cake", price: 70, icon: "🍰", type: 1 },
                { id: 'fries', name: "fries", price: 45, icon: "🍟", type: 1 },
                { id: 'soup', name: "soup", price: 40, icon: "🥣", type: 1 }
            ],
            "Drinks": [
                { id: 'bobatea', name: "bubble tea", price: 55, icon: "🧋", type: 1 },
                { id: 'water', name: "water", price: 20, icon: "💧", type: 1 },
                { id: 'coffee', name: "coffee", price: 45, icon: "☕", type: 1 },
                { id: 'milk', name: "milk", price: 30, icon: "🥛", type: 1 },
            ]
        };

        let cart = {}; 
        let isSpinning = false;
        let selectedWordFromTap = null;

        function startOrdering() {
            document.getElementById('landingPage').classList.add('hidden');
            document.getElementById('kioskContainer').classList.remove('hidden');
            updateKiosk();
        }

        function updateKiosk() {
            const budget = parseFloat(document.getElementById('budgetInput').value) || 0;
            let total = 0; 
            const flat = Object.values(menuData).flat();
            Object.keys(cart).forEach(id => total += flat.find(m => m.id === id).price * cart[id]);
            const remaining = budget - total;
            document.getElementById('totalDisplay').innerText = `$${total}`;
            document.getElementById('balanceDisplayTop').innerText = `$${remaining}`;
            document.getElementById('payBtn').disabled = total === 0 || total > budget;

            const grid = document.getElementById('menuGrid'); grid.innerHTML = '';
            for (const [cat, items] of Object.entries(menuData)) {
                const h = document.createElement('div'); h.className="category-header"; h.innerText=cat; grid.appendChild(h);
                items.forEach(item => {
                    const afford = item.price <= remaining;
                    const d = document.createElement('div');
                    d.className = `item-card p-4 text-center cursor-pointer ${afford ? '' : 'item-disabled'}`;
                    if(afford) d.onclick = () => { cart[item.id] = (cart[item.id]||0)+1; updateKiosk(); };
                    d.innerHTML = `<div class="text-4xl mb-2 emoji-text">${item.icon}</div><div class="font-black uppercase text-xs">${item.name}</div><div class="text-lg font-black text-red-600">$${item.price}</div>`;
                    grid.appendChild(d);
                });
            }
            const list = document.getElementById('cartList'); list.innerHTML = '';
            Object.keys(cart).forEach(id => {
                const item = flat.find(m => m.id === id);
                const row = document.createElement('div'); row.className = "flex justify-between items-center bg-gray-100 p-3 rounded-xl border-l-4 border-red-600";
                row.innerHTML = `<div class="font-bold uppercase text-xs">x${cart[id]} ${item.name}</div><button onclick="delete cart['${id}']; updateKiosk();" class="text-red-600 font-black px-2">✕</button>`;
                list.appendChild(row);
            });
        }

        function resetOrder() { cart = {}; updateKiosk(); }

        function handleCheckout() {
            const budget = parseFloat(document.getElementById('budgetInput').value) || 0;
            const flat = Object.values(menuData).flat();
            let total = 0;
            const recList = document.getElementById('receiptItems');
            recList.innerHTML = '';
            Object.keys(cart).forEach(id => {
                const item = flat.find(m => m.id === id);
                total += (item.price * cart[id]);
                recList.innerHTML += `<div class="flex justify-between"><span>${item.name}</span><span>x${cart[id]}</span></div>`;
            });
            document.getElementById('receiptChange').innerText = `$${budget - total}`;
            document.getElementById('kioskContainer').classList.add('hidden');
            document.getElementById('gameModal').classList.remove('hidden');
            initGame();
        }

        // TOUCH & DRAG CUSTOM LOGIC
        function initGame() {
            const bankWords = new Set(["a", "an", "some"]);
            Object.keys(cart).forEach(id => {
                const item = Object.values(menuData).flat().find(m => m.id === id);
                const qty = cart[id];
                if (item.type === 0 && qty > 1) {
                    if (numberToWord[qty]) bankWords.add(numberToWord[qty]);
                    else bankWords.add("some");
                }
            });

            const bank = document.getElementById('wordBank'); bank.innerHTML = '';
            const ghost = document.getElementById('dragGhost');

            Array.from(bankWords).sort().forEach(word => {
                const pill = document.createElement('span');
                pill.className = "word-pill shadow-md";
                pill.innerText = word;
                
                // Pointer Events for Dragging (Works on Touch + Mouse)
                pill.onpointerdown = (e) => {
                    pill.releasePointerCapture(e.pointerId); // Allows us to track moves outside the element
                    
                    // Toggle Click Selection
                    if(selectedWordFromTap === pill) {
                        pill.classList.remove('active-tap');
                        selectedWordFromTap = null;
                    } else {
                        document.querySelectorAll('.word-pill').forEach(p => p.classList.remove('active-tap'));
                        pill.classList.add('active-tap');
                        selectedWordFromTap = pill;
                    }

                    // Ghost Setup for Dragging
                    ghost.innerText = word;
                    ghost.style.display = 'block';
                    ghost.style.left = e.clientX + 'px';
                    ghost.style.top = e.clientY + 'px';

                    const onMove = (me) => {
                        ghost.style.left = me.clientX + 'px';
                        ghost.style.top = me.clientY + 'px';
                        
                        // Check for hit target
                        const target = document.elementFromPoint(me.clientX, me.clientY);
                        document.querySelectorAll('.drop-zone').forEach(dz => dz.classList.remove('target-highlight'));
                        if(target && target.classList.contains('drop-zone')) {
                            target.classList.add('target-highlight');
                        }
                    };

                    const onUp = (ue) => {
                        ghost.style.display = 'none';
                        const target = document.elementFromPoint(ue.clientX, ue.clientY);
                        if(target && target.classList.contains('drop-zone')) {
                            target.innerText = word;
                            pill.classList.remove('active-tap');
                            selectedWordFromTap = null;
                        }
                        window.removeEventListener('pointermove', onMove);
                        window.removeEventListener('pointerup', onUp);
                    };

                    window.addEventListener('pointermove', onMove);
                    window.addEventListener('pointerup', onUp);
                };

                bank.appendChild(pill);
            });

            const list = document.getElementById('challengeList'); list.innerHTML = '';
            Object.keys(cart).forEach(id => {
                const item = Object.values(menuData).flat().find(m => m.id === id);
                const qty = cart[id];
                let correct;
                if(item.type === 1) { correct = "some"; } 
                else if(qty === 1) { correct = ['a','e','i','o','u'].includes(item.name[0]) ? "an" : "a"; }
                else { correct = numberToWord[qty] || "some"; }

                const display = (qty > 1 && item.type === 0) ? item.plural : item.name;
                const d = document.createElement('div'); 
                d.className = "bg-white p-6 rounded-2xl border-2 flex items-center gap-4 text-2xl font-bold shadow-sm";
                
                const dz = document.createElement('div');
                dz.className = "drop-zone";
                dz.dataset.ans = correct;
                dz.innerText = "...";
                
                // Tap-to-fill logic
                dz.onclick = () => {
                    if(selectedWordFromTap) {
                        dz.innerText = selectedWordFromTap.innerText;
                        selectedWordFromTap.classList.remove('active-tap');
                        selectedWordFromTap = null;
                    }
                };

                const sentence = document.createElement('span');
                sentence.innerHTML = `<span class="emoji-text">${item.icon}</span> I want `;
                
                const endPart = document.createElement('span');
                endPart.innerText = ` ${display}.`;

                d.appendChild(sentence);
                d.appendChild(dz);
                d.appendChild(endPart);
                list.appendChild(d);
            });
        }

        function checkAnswers() {
            let all = true;
            document.querySelectorAll('.drop-zone').forEach(z => {
                if(z.innerText.trim().toLowerCase() === z.dataset.ans.toLowerCase()) { 
                    z.parentElement.classList.add('correct-glow'); 
                }
                else { all = false; }
            });
            if(all) { 
                document.getElementById('checkBtn').classList.add('hidden'); 
                document.getElementById('finishBtn').classList.remove('hidden'); 
            }
        }

        function openWheelModal() { document.getElementById('wheelModal').classList.remove('hidden'); }

        function spinWheel() {
            if(isSpinning) return; isSpinning = true;
            const wheel = document.getElementById('wheel');
            const segmentIndex = Math.floor(Math.random() * 6); 
            const results = [1, 2, 3, 1, 2, 3];
            const stopAngle = (segmentIndex * 60) + 30;
            const totalRotation = (360 * 5) + stopAngle; 
            wheel.style.transform = `rotate(-${totalRotation}deg)`;
            setTimeout(() => {
                isSpinning = false;
                document.getElementById('spinBtn').classList.add('hidden');
                document.getElementById('wheelResult').classList.remove('hidden');
                const win = results[segmentIndex];
                document.getElementById('stampsWonMsg').innerText = "★".repeat(win);
                document.getElementById('congratsMsg').innerText = `YOU WON ${win} STAMP${win>1?'S':''}!`;
            }, 4100);
        }

        function closeChallenge() {
            document.getElementById('gameModal').classList.add('hidden');
            document.getElementById('kioskContainer').classList.remove('hidden');
        }
    </script>
</body>
</html>
